<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101318">
    <meta name="description" content="A gallery of astrophotography and night-sky photographs.">
    <title>Astrophotography — Dara Callinan</title>
    <link rel="stylesheet" href="./styles.css">
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header container">
      <a class="site-brand" href="./">Dara<span class="brand-mark"></span><span class="brand-tld">.ie</span></a>
      <nav class="site-nav" aria-label="Primary navigation">
        <ul>
          <li><a href="./astrophotography.html" aria-current="page">Astrophotography</a></li>
          <li><a href="./projects.html">Projects</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="container page-main">
      <header class="page-intro">
        <p class="eyebrow">Behind the lens <span aria-hidden="true">/</span> Beyond the telescope</p>
        <h1>Astrophotography<span class="brand-mark">.</span></h1>
        <p>Images of the night sky, captured through lenses & telescopes. Weather permitting.</p>
      </header>

      <!-- Load cards from data/gallery.json. -->
      <section aria-label="Photo gallery" class="gallery-grid" id="photo-gallery">
        <p class="gallery-message" role="status">Loading photographs…</p>
      </section>
      <noscript><p class="gallery-message">This gallery needs JavaScript to load its photograph list.</p></noscript>


      <!-- SVG icons -->
      <svg class="gallery-icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <symbol id="detail-icon-telescope" viewBox="0 0 24 24">
          <path d="M4.7 5.2 16.4 10.7l-1.25 2.65L3.45 7.85Z"/>
          <path d="m5.9 5.75-1.25 2.65"/>
          <path d="m16.4 10.7 2.5 1.2-1.25 2.65-2.5-1.2"/>
          <path d="M11 11.4 12 15.1m0 0-3.8 6m3.8-6 4 6M7 21.1h11"/>
        </symbol>
        <symbol id="detail-icon-camera" viewBox="0 0 24 24">
          <path d="M14 4h-4l-2 3H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-4l-2-3Z"/><circle cx="12" cy="13" r="3"/>
        </symbol>
        <symbol id="detail-icon-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </symbol>
        <symbol id="detail-icon-map-pin" viewBox="0 0 24 24">
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>
        </symbol>
        <symbol id="detail-icon-filter" viewBox="0 0 24 24">
          <circle cx="10" cy="12" r="5.5"/>
          <circle cx="14" cy="12" r="5.5"/>
        </symbol>
        <symbol id="detail-icon-calendar" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>
        </symbol>
        <symbol id="detail-icon-aperture" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/><path d="m14.3 3.3-3.1 5.4M20.5 8l-6.2.1m3 10.7-3.2-5.3M9.7 20.7l3.1-5.4M3.5 16l6.2-.1m-3-10.7 3.2 5.3"/>
        </symbol>
        <symbol id="detail-icon-settings" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2 2-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.57V21h-2.8v-.09a1.7 1.7 0 0 0-1-1.57 1.7 1.7 0 0 0-1.88.34l-.06.06-2-2 .06-.06A1.7 1.7 0 0 0 7.5 15a1.7 1.7 0 0 0-1.57-1H5v-2.8h.09a1.7 1.7 0 0 0 1.57-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2-2 .06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1-1.57V5h2.8v.09a1.7 1.7 0 0 0 1 1.57 1.7 1.7 0 0 0 1.88-.34l.06-.06 2 2-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.57 1H21v2.8h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
        </symbol>
        <symbol id="detail-icon-layers" viewBox="0 0 24 24">
          <path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>
        </symbol>
        <symbol id="detail-icon-sparkles" viewBox="0 0 24 24">
          <path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3ZM19 17l.7 1.8L21.5 19.5l-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7L19 17Z"/>
        </symbol>
        <symbol id="detail-icon-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>
        </symbol>
      </svg>


      <!-- One modal for each photo. -->
      <dialog id="photo-lightbox" class="photo-lightbox" aria-label="Photograph viewer">
        <div class="lightbox-layout">
          <div class="lightbox-image-panel">
            <img id="lightbox-image" alt="">
          </div>
          <aside class="lightbox-info" aria-label="Photograph details">
            <div class="lightbox-heading-row">
              <p class="lightbox-eyebrow">Astrophotography</p>
              <div class="lightbox-heading-actions">
                <a id="lightbox-instagram" class="lightbox-instagram" hidden
                   target="_blank" rel="noopener noreferrer"
                   aria-label="View this photograph on Instagram" title="View on Instagram">
                  <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <rect x="2" y="2" width="20" height="20" rx="5"></rect>
                    <circle cx="12" cy="12" r="4.1"></circle>
                    <circle cx="17.6" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
                  </svg>
                </a>
                <button class="lightbox-close" type="button" aria-label="Close photograph">&times;</button>
              </div>
            </div>
            <!-- <h2 id="lightbox-title"></h2> -->
            <div class="lightbox-title-row">
              <h2 id="lightbox-title"></h2>
            </div>
            <div id="lightbox-details" class="lightbox-details"></div>
            <div class="lightbox-controls" aria-label="Photograph navigation">
              <button id="lightbox-prev" type="button" aria-label="Previous photograph">&larr;</button>
              <span id="lightbox-count" aria-live="off"></span>
              <button id="lightbox-next" type="button" aria-label="Next photograph">&rarr;</button>
            </div>
          </aside>
        </div>
      </dialog>

    </main>

    <footer class="site-footer container">
      <p>© Dara Callinan</p>
      <p>Made  with HTML, JavaScript &amp; CSS.</p>
    </footer>
    <script src="./gallery.js" defer></script>
  </body>
</html>
